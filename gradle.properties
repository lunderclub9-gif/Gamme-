# Project-wide Gradle settings.
# Keep the build usable on modest Windows/Linux machines (including 4 GB RAM).
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin compiler runs in-process to avoid a second large JVM on low-memory machines.
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official

android.nonTransitiveRClass=true
googleServices.missing.passthrough=true
